[package]
name = "host1x-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
std = ["snafu/std"]

[dependencies]
arbitrary-int.workspace = true
zerocopy.workspace = true
host1x-reg.path = "../host1x-reg"
