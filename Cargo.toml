[workspace]
resolver = "3"
members = [
    "crates/basic-test",
    "crates/colorspace",
    "crates/gr2d",
    "crates/gr2d-reg",
    "crates/host1x-buffer",
    "crates/host1x-client",
    "crates/host1x-core",
    "crates/host1x-drm",
    "crates/host1x-reg",
    "crates/instrumentation",
]

[workspace.dependencies]
drm = "0.15"
drm-ffi = "0.9"
drm-fourcc = "2"
pin-project = "1"
tokio = "1"
tokio-util = "0.7"
futures = { version = "0.3", default-features = false }
rustix = "1"
bitflags = "1"
snafu = { version = "0.9", default-features = false }
tracing = { version = "0.1", features = ["valuable"] }
tracing-subscriber = { version = "0.3", features = ["valuable"] }
tracing-tracy = "0.11"
tracy-client = "0.18"
zerocopy = "0.8"
tock-registers = "0.10"
arbitrary-int = { version = "2", default-features = false }
anyhow = "1"
valuable = "0.1"
once_cell = "1"
getset = "0.1"
embedded-graphics = "0.8"
paste = "1"
